<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AeroBase — Airline Management System</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────── -->
<header>
  <div class="logo">Aero<span>Base</span></div>
  <div class="tagline">// Airline Management System — Phase 2</div>
  <div class="status-dot" id="statusDot"></div>
  <div class="status-label" id="statusLabel">Connecting...</div>
</header>

<!-- ── LAYOUT ──────────────────────────────────────────────── -->
<div class="layout">

  <!-- SIDEBAR -->
  <nav>
    <div class="nav-section">Overview</div>
    <button class="nav-btn active" data-section="dashboard">
      <span class="icon">📊</span>Dashboard
    </button>

    <div class="nav-section">Core Entities</div>
    <button class="nav-btn" data-section="passengers">
      <span class="icon">🧳</span>Passengers
    </button>
    <button class="nav-btn" data-section="flights">
      <span class="icon">✈️</span>Flights
    </button>
    <button class="nav-btn" data-section="crew">
      <span class="icon">👨‍✈️</span>Crew
    </button>

    <div class="nav-section">Operations</div>
    <button class="nav-btn" data-section="boarding">
      <span class="icon">🎫</span>Boarding Passes
    </button>
    <button class="nav-btn" data-section="security">
      <span class="icon">🔒</span>Security Checks
    </button>
    <button class="nav-btn" data-section="baggage">
      <span class="icon">📦</span>Baggage
    </button>

    <div class="nav-section">Infrastructure</div>
    <button class="nav-btn" data-section="airlines">
      <span class="icon">🏢</span>Airlines
    </button>
    <button class="nav-btn" data-section="airports">
      <span class="icon">🌍</span>Airports
    </button>
  </nav>

  <!-- MAIN CONTENT -->
  <main id="mainContent">
    <div class="empty">
      <div class="e-icon">⏳</div>
      Loading...
    </div>
  </main>

</div>

<!-- ── MODAL ────────────────────────────────────────────────── -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <h3 id="modalTitle">Form</h3>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────────────── -->
<div id="toast">
  <div class="toast-dot" id="toastDot"></div>
  <span id="toastMsg"></span>
</div>

<script src="app.js"></script>
</body>
</html>
